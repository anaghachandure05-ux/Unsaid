<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unsaid — Sign In</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Unsaid</a>
    <div class="nav-actions">
      <a href="/app" class="muted" style="text-decoration:none;">User Chat</a>
      <a href="/admin" class="muted" style="text-decoration:none;">Admin</a>
    </div>
  </header>

  <main class="container">
    <div class="card auth-box">
      <h1>Unsaid</h1>
      <p class="muted" style="margin-bottom:18px;">Send private messages and get replies.</p>

      <div class="tabs">
        <button id="loginTab" class="tab-btn active" type="button">Log In</button>
        <button id="registerTab" class="tab-btn" type="button">Create Account</button>
      </div>

      <form id="authForm">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <button id="submitBtn" class="btn" type="submit" style="width:100%;">Log In</button>
        <div id="errorBox" class="error-msg"></div>
      </form>
    </div>
  </main>

  <script src="/auth.js"></script>
  <script>
    let mode = "login";
    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");
    const submitBtn = document.getElementById("submitBtn");
    const passwordInput = document.getElementById("password");
    const errorBox = document.getElementById("errorBox");

    function setMode(newMode) {
      mode = newMode;
      errorBox.textContent = "";
      if (mode === "login") {
        loginTab.classList.add("active");
        registerTab.classList.remove("active");
        submitBtn.textContent = "Log In";
        passwordInput.autocomplete = "current-password";
      } else {
        registerTab.classList.add("active");
        loginTab.classList.remove("active");
        submitBtn.textContent = "Create Account";
        passwordInput.autocomplete = "new-password";
      }
    }

    loginTab.addEventListener("click", () => setMode("login"));
    registerTab.addEventListener("click", () => setMode("register"));

    (async () => {
      const me = await getCurrentUser();
      if (me.loggedIn) {
        window.location.href = me.isAdmin ? "/admin" : "/app";
      }
    })();

    document.getElementById("authForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.textContent = "";
      const username = document.getElementById("username").value.trim();
      const password = passwordInput.value;
      const endpoint = mode === "login" ? "/api/login" : "/api/register";

      const { ok, data } = await apiRequest(endpoint, {
        method: "POST",
        body: JSON.stringify({ username, password })
      });

      if (!ok) {
        errorBox.textContent = data.error || "Something went wrong";
        return;
      }

      if (mode === "login" && data.isAdmin) {
        window.location.href = "/admin";
      } else {
        window.location.href = "/app";
      }
    });
  </script>
</body>
</html>
